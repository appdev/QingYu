name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.1.1 或 v0.1.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check Android release signing secrets
        env:
          ANDROID_SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$ANDROID_SIGNING_READY" != true ]; then
            echo '::error::Configure the Android signing secrets listed in README.md before running Release.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: node --test .github/scripts/release-version.check.mjs
      - name: Prepare release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag=$(node .github/scripts/release-version.mjs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features server --lib
      - name: Create or verify release tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{tree}")" != "$(git write-tree)" ]; then
              echo '::error::The existing tag points to different source; choose a new version'
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git diff --cached --quiet; then
              git commit -m "mod: release $RELEASE_TAG"
            fi
            git tag -a "$RELEASE_TAG" -m "QingYu $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          echo "commit=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Create or resume draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
              notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "轻羽 QingYu $RELEASE_TAG" "${notes[@]}"
          fi
          echo "id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install pinned Rust toolchain and target
        run: rustup target add "${{ matrix.target }}"
      - run: npm ci
      - name: Build and upload installers to draft
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          releaseDraft: true
          uploadUpdaterJson: false
          tauriScript: npm run tauri
          releaseAssetNamePattern: QingYu_[version]_[platform]_[arch][setup][ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - run: npm ci
      - name: Build Android arm64 release APK
        run: npm run tauri -- android build --ci --target aarch64 --apk -- --locked
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned='src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk'
          apk="$RUNNER_TEMP/QingYu_${RELEASE_TAG#v}_android_arm64.apk"
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/qingyu-keystore.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/qingyu-aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/qingyu-aligned.apk"
          "$tools/apksigner" verify "$apk"
      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/QingYu_${RELEASE_TAG#v}_android_arm64.apk" --clobber

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
