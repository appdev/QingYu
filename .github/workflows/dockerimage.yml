name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否仅构建预发布镜像"
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      prerelease:
        description: "是否仅构建预发布镜像"
        required: true
        type: boolean

env:
  package_json: "app/package.json"
  docker_hub_owner: "apkdv"
  docker_hub_repo: "qingyu"

jobs:
  build:
    if: ${{ github.repository == 'appdev/QingYu' }}
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Extract version from package.json
        id: version
        run: |
          echo "value=$(jq .version ${{ env.package_json }} -r)" >> $GITHUB_OUTPUT

      - name: Validate image version
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9A-Za-z.-]+)?$ ]]; then
              echo "Prerelease version must use an alpha, beta, or rc suffix: $VERSION"
              exit 1
            fi
          elif [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable version must match x.y.z: $VERSION"
            exit 1
          fi
          echo "Image version is valid: $VERSION"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ !inputs.prerelease }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v8
          push: ${{ !inputs.prerelease }}
          tags: |
            apkdv/qingyu:latest
            apkdv/qingyu:v${{ steps.version.outputs.value }}
