name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "@markra/desktop"
            package: "@markra/desktop"
            args: ""
            shard: ""
          - label: "@markra/web"
            package: "@markra/web"
            args: ""
            shard: ""
          - label: "@markra/app, workspace 1/2"
            package: "@markra/app"
            args: "src/App.test.tsx"
            shard: "1/2"
          - label: "@markra/app, workspace 2/2"
            package: "@markra/app"
            args: "src/App.test.tsx"
            shard: "2/2"
          - label: "@markra/app, editor 1/2"
            package: "@markra/app"
            args: "src/components/CodeMirrorPaperSurface.test.tsx"
            shard: "1/2"
          - label: "@markra/app, editor 2/2"
            package: "@markra/app"
            args: "src/components/CodeMirrorPaperSurface.test.tsx"
            shard: "2/2"
          - label: "@markra/app, remaining 1/2"
            package: "@markra/app"
            args: "--exclude=src/App.test.tsx --exclude=src/components/CodeMirrorPaperSurface.test.tsx --shard=1/2"
            shard: ""
          - label: "@markra/app, remaining 2/2"
            package: "@markra/app"
            args: "--exclude=src/App.test.tsx --exclude=src/components/CodeMirrorPaperSurface.test.tsx --shard=2/2"
            shard: ""
          - label: "@markra/editor"
            package: "@markra/editor"
            args: ""
            shard: ""
          - label: "@markra/kernel-client"
            package: "@markra/kernel-client"
            args: ""
            shard: ""
          - label: "@markra/markdown"
            package: "@markra/markdown"
            args: ""
            shard: ""
          - label: "@markra/scripts"
            package: "@markra/scripts"
            args: ""
            shard: ""
          - label: "@markra/shared"
            package: "@markra/shared"
            args: ""
            shard: ""
          - label: "@markra/ui"
            package: "@markra/ui"
            args: ""
            shard: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          MARKRA_APP_TEST_SHARD: ${{ matrix.shard }}
        run: pnpm --filter "${{ matrix.package }}" test ${{ matrix.args }}

  frontend-test-typecheck:
    name: Frontend Test Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tests
        run: pnpm run typecheck:test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-tests
      - frontend-test-typecheck
      - frontend-build
    if: always()

    steps:
      - name: Check frontend jobs
        run: |
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "Frontend Tests result: ${{ needs.frontend-tests.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-test-typecheck.result }}" != "success" ]; then
            echo "Frontend Test Typecheck result: ${{ needs.frontend-test-typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Frontend Build result: ${{ needs.frontend-build.result }}"
            exit 1
          fi

  kernel-rust:
    name: Kernel Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/kernel -> target

      - name: Check formatting
        run: cargo fmt --manifest-path apps/kernel/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path apps/kernel/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          cargo test --manifest-path apps/kernel/Cargo.toml --locked --all-targets --all-features
          cargo test --manifest-path apps/kernel/Cargo.toml --locked -p qingyu-dejavu --all-targets --all-features
          cargo test --manifest-path apps/kernel/Cargo.toml --locked --doc

      - name: Reject Tauri dependencies
        shell: bash
        run: |
          set -euo pipefail
          kernel_tree="$(cargo tree --manifest-path apps/kernel/Cargo.toml --locked --all-features --target all --prefix none)"
          if grep -Eiq '^tauri([[:space:]-]|$)' <<< "${kernel_tree}"; then
            echo "The platform-neutral Kernel must not depend on Tauri."
            exit 1
          fi

  tauri-rust:
    name: Tauri Rust
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  android-native:
    name: Android Native Composition
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_home="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "${ndk_home}" || ! -d "${ndk_home}" ]]; then
            echo "The GitHub runner does not expose a usable Android NDK." >&2
            exit 1
          fi
          echo "NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug Android composition
        run: pnpm app build android --debug --apk --target aarch64 --ci

  ios-native:
    name: iOS Native Composition
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install iOS Simulator Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build debug iOS Simulator composition
        run: pnpm app build ios --debug --target aarch64-sim --no-sign --ci
