[package]
name = "qingyu-dejavu"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
interop-cli = []

[[bin]]
name = "dejavu-interop"
path = "src/bin/dejavu-interop.rs"
required-features = ["interop-cli"]

[dependencies]
aes-gcm = "0.10.3"
async-trait = "0.1.89"
base64 = "0.22.1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
filetime = "0.2.26"
futures-util = "0.3"
getrandom = "0.4.3"
hmac = "0.12.1"
ignore = "0.4.28"
percent-encoding = "2.3"
quick-xml = { version = "0.39.2", features = ["async-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
scrypt = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2"
time = "0.3.44"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["io"] }
url = "2"
uuid = "1.24.0"
zeroize = "1"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
