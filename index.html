<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>轻羽 QingYu</title>
    <link rel="icon" type="image/png" href="/brand/qingyu-app.png" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="toolbar-ellipsis" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5.2" cy="12" r="1.85"/>
        <circle cx="12" cy="12" r="1.85"/>
        <circle cx="18.8" cy="12" r="1.85"/>
      </symbol>
      <filter id="toolbar-glass-refraction" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage href="/assets/toolbar-glass-map.svg" preserveAspectRatio="none" result="rim" />
        <feDisplacementMap in="SourceGraphic" in2="rim" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app-shell" data-sidebar="all">
      <aside id="library-sidebar" aria-label="笔记库">
        <div class="sidebar-panes">
        <section id="folder-pane" aria-label="文件夹">
          <div class="folder-toolbar" data-tauri-drag-region="deep">
            <button id="today-note-button" class="icon-button" disabled title="今日笔记" aria-label="今日笔记"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.45" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M3 6.5h14"/><text x="10" y="14.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="8" font-weight="600"></text></svg></button>
            <button id="library-search-button" class="icon-button" title="跳转到笔记（⌘K）" aria-label="搜索笔记"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
          </div>
          <div class="sidebar-brand"><span id="sidebar-brand-icon" class="sidebar-icon" aria-hidden="true"></span><span>文件夹</span><button id="new-folder-button" class="icon-button" title="新建文件夹（⌘⇧N）" aria-label="新建文件夹"></button></div>
          <nav id="folder-list" aria-label="笔记文件夹"></nav>
          <div class="sidebar-services">
            <button id="sidebar-account" class="sidebar-mac-action" aria-haspopup="dialog" aria-label="本地账户，设置">
              <span class="sidebar-account-avatar" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="4.4" r="2.8"/><path d="M1.9 13.5c0-2.7 2.7-4.6 6.1-4.6s6.1 1.9 6.1 4.6c0 .7-.5 1.1-1.2 1.1H3.1c-.7 0-1.2-.4-1.2-1.1Z"/></svg></span>
              <span class="sidebar-account-name">本地账户</span>
              <span class="sidebar-account-status" aria-hidden="true"></span>
              <span class="sidebar-account-spinner" aria-hidden="true"></span>
            </button>
          </div>
          <div id="folder-resizer" class="library-resizer" role="separator" aria-label="调整文件夹栏宽度" aria-controls="folder-pane" aria-orientation="vertical" aria-valuemin="0" tabindex="0"></div>
        </section>
        <section id="notes-pane" aria-label="笔记列表">
          <div class="notes-toolbar" data-tauri-drag-region="deep">
            <div class="notes-navigation">
              <button id="folders-back" class="icon-button" hidden aria-label="返回文件夹" aria-controls="folder-pane"></button>
              <span class="notes-navigation-title">笔记</span>
              <button id="list-more-button" class="icon-button" aria-label="列表选项" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#toolbar-ellipsis"/></svg></button>
              <button id="new-note-button" class="icon-button" title="新建笔记（⌘N）" aria-label="新建笔记"></button>
            </div>
            <input id="note-search" type="search" placeholder="搜索" aria-label="搜索笔记" autocomplete="off" />
          </div>
          <div class="notes-summary"><h2 id="notes-heading">全部</h2><span id="notes-count"></span></div>
          <div id="notes-list" role="listbox" aria-label="笔记"></div>
          <div id="notes-resizer" class="library-resizer" role="separator" aria-label="调整笔记列表宽度" aria-controls="notes-pane" aria-orientation="vertical" aria-valuemin="330" tabindex="0"></div>
        </section>
        </div>
        <div class="sidebar-footer">
          <button id="logout-button" class="icon-button" hidden title="退出登录" aria-label="退出登录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v16h5M12 12h9m-4-4 4 4-4 4"/></svg></button>
          <button id="workspace-back" class="icon-button" hidden title="返回笔记库（⌘⇧W）" aria-label="返回笔记库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button>
          <button id="settings-button" class="icon-button" title="设置" aria-label="设置" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 3h4l.7 2.5 2 .9 2.4-.9 2 3.5-1.7 1.8v2.4l1.7 1.8-2 3.5-2.4-.9-2 .9L14 21h-4l-.7-2.5-2-.9-2.4.9-2-3.5 1.7-1.8v-2.4L2.9 9l2-3.5 2.4.9 2-.9Z"/><circle cx="12" cy="12" r="3.1"/></svg></button>
          <button id="sync-button" class="icon-button" data-state="idle" title="S3 同步：尚未同步" aria-label="S3 同步：尚未同步" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 0 0-14-4L3 9m0-5v5h5M4 14a8 8 0 0 0 14 4l3-3m0 5v-5h-5"/></svg></button>
        </div>
      </aside>
      <button id="sidebar-backdrop" aria-label="关闭笔记库" tabindex="-1"></button>
      <div id="document-column">
    <header class="titlebar" data-tauri-drag-region="deep">
      <div class="note-navigation" role="group" aria-label="笔记浏览">
        <button id="note-back" class="icon-button" title="返回上一条笔记" aria-label="返回上一条笔记" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg></button>
        <button id="note-forward" class="icon-button" title="前往下一条笔记" aria-label="前往下一条笔记" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg></button>
      </div>
      <h1 id="note-title" data-tauri-drag-region>未命名</h1>
      <span id="note-location" data-tauri-drag-region></span>
      <button id="note-undo" class="icon-button" title="撤销" aria-label="撤销" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5 4 11l6 6M4 11h10a5 5 0 0 1 0 10h-2"/></svg></button>
      <nav class="actions" aria-label="编辑器工具栏">
        <button id="calendar-button" class="icon-button" hidden title="创建日程" aria-label="创建日程" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M12 14v4M10 16h4"/></svg></button>
        <button id="sidebar-button" class="icon-button" title="切换笔记列表" aria-label="列表" aria-controls="library-sidebar" aria-expanded="true" aria-pressed="false"></button>
        <button id="format-button" class="icon-button" title="格式" aria-label="格式" aria-expanded="false" aria-controls="format-menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.3 18.35 6.4 5.35l5.2 13M3 14.05h6.85"/>
            <path d="M14.65 11.6c.7-1.2 1.95-1.8 3.55-1.8 1.9 0 3 .98 3 2.73v5.82m0-5.12-3.85.32c-2.2.18-3.28 1.12-3.28 2.6 0 1.34 1.1 2.3 2.73 2.3 2.26 0 4.4-1.55 4.4-3.47"/>
          </svg>
        </button>
        <button id="checklist-button" class="icon-button" title="任务清单" aria-label="任务清单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M1.6 6.35a4 4 0 1 1 8 0 4 4 0 0 1-8 0Zm2.13-.22a.55.55 0 0 0 0 .78l1.22 1.22a.55.55 0 0 0 .8-.03l2.19-2.49a.55.55 0 0 0-.83-.72L5.3 6.94l-.79-.81a.55.55 0 0 0-.78 0Z"/>
            <circle cx="5.6" cy="17.65" r="3.2"/>
            <path d="M12.45 6.35h9.2m-9.2 11.3h9.2"/>
          </svg>
        </button>
        <button id="table-button" class="icon-button" title="插入表格" aria-label="插入表格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.95" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="1.2" y="4.2" width="21.6" height="15.6" rx="2.1"/>
            <path d="M12 4.2v15.6M1.2 9.4h21.6M1.2 14.6h21.6"/>
          </svg>
        </button>
        <button id="attach-button" class="icon-button" title="添加附件" aria-label="添加附件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m7.65 14.5 7.7-7.7a1.8 1.8 0 0 1 2.55 2.55l-9.1 9.1a3.55 3.55 0 0 1-5.02-5.02l9.24-9.24a5.05 5.05 0 0 1 7.14 7.14l-8.8 8.8"/>
          </svg>
        </button>
        <button id="share-button" class="icon-button" title="分享" aria-label="分享" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.15 8.6H6.6a2.6 2.6 0 0 0-2.6 2.6v8.1a2.6 2.6 0 0 0 2.6 2.6h10.8a2.6 2.6 0 0 0 2.6-2.6v-8.1a2.6 2.6 0 0 0-2.6-2.6h-1.55M12 15.4V2.3M8.25 6.1 12 2.3l3.75 3.8"/>
          </svg>
        </button>
        <button id="note-more-button" class="icon-button" title="更多操作" aria-label="更多操作" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#toolbar-ellipsis"/></svg>
        </button>
      </nav>
    </header>
    <glass-progressive-blur class="editor-scroll-edge" edge="top" blur="20" layers="6" aria-hidden="true"></glass-progressive-blur>
    <div class="editor-scroll-wash" aria-hidden="true"></div>
    <main id="workspace">
      <section id="rich-pane" aria-label="所见即所得编辑区"><div id="rich-editor"></div></section>
    </main>
    <section id="empty-note" hidden><p>此文件夹还没有笔记</p><button id="new-empty-note" class="button secondary-button">新建笔记</button></section>
      </div>
    </div>
    <footer class="statusbar"><span id="save-status" role="status" aria-live="polite">草稿已保留</span><span id="word-count"></span></footer>
    <div id="format-menu" class="format-menu" role="menu" aria-label="Markdown 格式" hidden></div>
    <div id="mobile-tools" class="mobile-tools" aria-label="快捷格式工具栏" hidden></div>
    <dialog id="folder-dialog" class="alert-dialog" aria-labelledby="folder-dialog-title" aria-describedby="folder-dialog-message">
      <form id="folder-form">
        <h2 id="folder-dialog-title">新建文件夹</h2>
        <p id="folder-dialog-message">为此文件夹输入名称。</p>
        <label for="folder-name">名称</label><input id="folder-name" required maxlength="80" autocomplete="off" placeholder="名称" />
        <p id="folder-error" role="alert"></p>
        <div class="alert-actions"><button id="create-folder" class="button primary-button" type="submit" disabled>创建</button><button id="cancel-folder" class="button secondary-button" type="button">取消</button></div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
