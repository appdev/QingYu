<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Red and green move the sample inward at each edge and leave the center neutral. -->
    <linearGradient id="horizontal">
      <stop stop-color="#ff0000"/>
      <stop offset="20%" stop-color="#800000"/>
      <stop offset="80%" stop-color="#800000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="vertical" x2="0" y2="1">
      <stop stop-color="#00ff00"/>
      <stop offset="25%" stop-color="#008000"/>
      <stop offset="75%" stop-color="#008000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#horizontal)"/>
  <rect width="100" height="100" fill="url(#vertical)" style="mix-blend-mode:screen"/>
</svg>
