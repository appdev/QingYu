productName: "QingYu"
appId: "com.apkdv.qingyu"
publish: null
asar: false
compression: "normal"
copyright: "QingYu Project"
artifactName: "qingyu-${version}-${os}-arm64.${ext}"
extraMetadata:
  main: "electron/main.js"
directories:
  output: "build"
dmg:
  contents:
    - x: 130
      y: 180
    - x: 410
      y: 180
      type: "link"
      path: "/Applications"
    - x: 270
      y: 310
      type: "file"
      path: "resources/macos/自动安装.sh"
      name: "自动安装.sh"
files:
  - "electron"
afterPack: "./scripts/afterPack.js"

mac:
  identity: null
  icon: "src/assets/icon.icns"
  gatekeeperAssess: false
  hardenedRuntime: true
  entitlements: "../../entitlements.mas.plist"
  extendInfo:
    - NSMicrophoneUsageDescription: "This app requires microphone access to record audio."
  entitlementsInherit: "../../entitlements.mas.plist"
  minimumSystemVersion: "12.0.0"
  protocols:
    - name: "QingYu"
      schemes:
        - "qingyu"
  extraResources:
    - from: "kernel-darwin-arm64"
      to: "kernel"
  target:
    - target: "dmg"
      arch: "arm64"

extraResources:
  - from: "changelogs"
    to: "changelogs"
  - from: "stage"
    to: "stage"
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter: "!**/{.DS_Store}"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
  - from: "pandoc/pandoc-darwin-arm64.zip"
    to: "pandoc.zip"
  - from: "pandoc/pandoc-resources"
    to: "pandoc-resources"
    filter: "!**/{.DS_Store}"
