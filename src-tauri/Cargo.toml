[package]
name = "miaoyan-editor"
version = "0.1.0"
description = "A focused Markdown editor inspired by MiaoYan"
edition = "2021"

[lib]
name = "miaoyan_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
regex = "1"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-segmentation = "1"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
fontdb = "0.24"
tauri-plugin-global-shortcut = "2"
notify = "8.2.2"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSNotification", "NSOperation", "NSString", "NSGeometry", "NSProcessInfo", "NSFileManager", "NSPathUtilities", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSMenu", "NSMenuItem", "NSImage", "NSPopover", "NSViewController", "NSView", "NSControl", "NSTextField", "NSFont", "NSFontDescriptor", "NSColor", "NSWindow", "NSResponder", "NSScrollView", "NSTextView", "NSText", "NSWorkspace", "objc2-quartz-core", "objc2-core-graphics"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
