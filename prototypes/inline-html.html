<!doctype html>
<html lang="zh-CN" data-theme="dark">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行内 HTML 编辑验证</title>
<style>
  :root { color-scheme: dark; --paper:#1f1e1d; --ink:#d6d1c6; --muted:#918d83; --line:#3b3935; --brand:#70b98a; --code:#292824; --preview-font:system-ui; --preview-size:16px; }
  body { margin:24px; background:var(--paper); color:var(--ink); font:14px/1.6 system-ui; }
  main { max-width:1100px; margin:auto; }
  #rich-editor { height:560px; border:1px solid var(--line); }
  #rich-editor [data-type='link-ref-defs-block'] { display:block !important; }
  textarea { width:100%; box-sizing:border-box; height:260px; background:var(--code); color:var(--ink); font:13px/1.6 monospace; }
</style>
<main>
  <h1>行内 HTML 编辑验证</h1>
  <p>与主编辑器共用转换流程，不读取或保存笔记。支持配对、无属性的 mark / sub / sup / u / kbd；其他 HTML 保留 SDK 原有表示。</p>
  <button id="reset">恢复样例</button>
  <div id="rich-editor"></div>
  <label for="writeback">当前 Markdown 回写</label>
  <textarea id="writeback" readonly></textarea>
</main>
<script type="module" src="./inline-html-demo.ts"></script>
</html>
