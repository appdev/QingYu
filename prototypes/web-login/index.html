<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="轻羽 QingYu 网页版访问密码页设计预览，使用部署时配置的密码进入笔记库。" />
    <title>轻羽 QingYu 登录页设计预览</title>
    <link rel="icon" type="image/png" href="/brand/qingyu-app.png" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="brand"><span class="brand-icon" aria-hidden="true"></span><span>轻羽</span></div>
        <span class="edition">网页版</span>
      </header>

      <main class="login-spread">
        <section class="introduction" aria-label="轻羽 QingYu 编辑器">
          <div class="introduction-copy">
            <p class="wordmark">轻羽</p>
            <p class="introduction-line">给文字，一处安静的地方。</p>
            <p class="introduction-caption">QingYu Markdown 编辑器</p>
          </div>
          <p class="introduction-footnote">记录日常，也留住偶然的想法。</p>
        </section>

        <section class="login-region" aria-labelledby="login-heading">
          <div class="login-content">
            <header class="form-heading">
              <h1 id="login-heading">进入笔记库</h1>
              <p>输入访问密码，继续阅读和编辑。</p>
            </header>
            <p class="session-notice" id="session-notice" role="status" hidden>会话已过期，请重新输入访问密码。</p>

            <form id="login-form" novalidate aria-describedby="form-message">
              <div class="field">
                <label for="password">访问密码</label>
                <div class="password-field">
                  <input id="password" type="password" autocomplete="current-password" required aria-required="true" aria-describedby="password-help" />
                  <button class="visibility-button" id="password-visibility" type="button" aria-label="显示密码" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 4 16 16"/></svg>
                  </button>
                </div>
                <p class="field-help" id="password-help"></p>
              </div>
              <button class="login-button" id="login-button" type="submit"><span class="spinner" aria-hidden="true"></span><span id="login-button-label">进入笔记库</span></button>
              <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>
            <p class="access-note">访问密码由此笔记库的部署者设置。</p>
            <noscript><p class="noscript-notice">此页为设计预览，尚未连接登录服务。</p></noscript>
          </div>
        </section>
      </main>

      <footer class="page-footer">
        <span class="preview-label">设计预览</span>
        <div class="state-switcher" role="group" aria-label="预览登录状态">
          <button type="button" data-state="default" aria-pressed="true">默认</button>
          <button type="button" data-state="error" aria-pressed="false">密码错误</button>
          <button type="button" data-state="loading" aria-pressed="false">登录中</button>
          <button type="button" data-state="expired" aria-pressed="false">会话过期</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./login.js"></script>
  </body>
</html>
